// Better Zen domain-only URL bar AutoConfig.
try {
  var Cc = Components.classes;
  var Ci = Components.interfaces;
  var io = Cc["@mozilla.org/network/io-service;1"].getService(Ci.nsIIOService);
  var eTLD = Cc["@mozilla.org/network/effective-tld-service;1"].getService(Ci.nsIEffectiveTLDService);
  var wm = Cc["@mozilla.org/appshell/window-mediator;1"].getService(Ci.nsIWindowMediator);
  var obs = Cc["@mozilla.org/observer-service;1"].getService(Ci.nsIObserverService);

  function domainOnly(spec) {
    if (!spec || typeof spec != "string") {
      return spec;
    }

    try {
      var uri = io.newURI(spec);
      if (!uri.schemeIs("http") && !uri.schemeIs("https")) {
        return spec;
      }

      var host = uri.displayHost || uri.host;
      if (!host) {
        return spec;
      }

      try {
        return eTLD.getBaseDomainFromHost(host);
      } catch (e) {
        return host;
      }
    } catch (e) {
      return spec;
    }
  }

  function patchWindow(win) {
    if (!win || win.closed) {
      return false;
    }

    var urlbar = win.gURLBar || win.document.getElementById("urlbar");
    if (!urlbar || !urlbar.inputField || urlbar.__betterZenDomainOnlyPatched) {
      return !!(urlbar && urlbar.__betterZenDomainOnlyPatched);
    }

    var trimForDisplay = function (url) {
      if (urlbar.hasAttribute("breakout-extend")) {
        return url;
      }
      return domainOnly(url);
    };

    try {
      Object.defineProperty(urlbar, "_zenTrimURL", {
        configurable: true,
        enumerable: true,
        get: function () {
          return trimForDisplay;
        },
        set: function () {},
      });
    } catch (e) {
      try {
        urlbar._zenTrimURL = trimForDisplay;
      } catch (e2) {}
    }

    var input = urlbar.inputField;
    input.addEventListener("focus", function () {
      try {
        if (!urlbar.valueIsTyped && !urlbar.searchMode &&
            urlbar.getAttribute("pageproxystate") == "valid" &&
            urlbar._untrimmedValue) {
          urlbar.setValue(urlbar._untrimmedValue, {
            allowTrim: false,
            valueIsTyped: false,
          });
        }
      } catch (e) {}
    }, true);

    input.addEventListener("blur", function () {
      win.setTimeout(function () {
        try {
          if (!urlbar.focused && !urlbar.hasAttribute("breakout-extend") &&
              !urlbar.valueIsTyped && !urlbar.searchMode &&
              urlbar.getAttribute("pageproxystate") == "valid") {
            urlbar.handleRevert();
          }
        } catch (e) {}
      }, 80);
    }, true);

    try {
      if (urlbar._untrimmedValue) {
        urlbar.handleRevert();
      }
    } catch (e) {}

    urlbar.__betterZenDomainOnlyPatched = true;
    return true;
  }

  function patchWindows(attempt) {
    var windows = 0;
    var patched = 0;
    var enumerator = wm.getEnumerator("navigator:browser");

    while (enumerator.hasMoreElements()) {
      windows++;
      try {
        if (patchWindow(enumerator.getNext())) {
          patched++;
        }
      } catch (e) {}
    }

    if (patched < windows && attempt < 20) {
      var recent = wm.getMostRecentWindow("navigator:browser");
      if (recent && !recent.closed) {
        recent.setTimeout(function () {
          patchWindows(attempt + 1);
        }, 250);
      }
    }
  }

  var observer = {
    observe: function () {
      patchWindows(0);
    },
  };

  [
    "browser-delayed-startup-finished",
    "domwindowopened",
    "final-ui-startup",
    "sessionstore-windows-restored",
  ].forEach(function (topic) {
    try {
      obs.addObserver(observer, topic, false);
    } catch (e) {}
  });

  patchWindows(0);
} catch (e) {}
